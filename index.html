<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="🐸 БАҚАНЫ БАСЫП, СӨЗДІ ОҚЫ! — 40 сөз">
<meta property="og:description" content="3 және 4 әріпті 40 сөзді бақамен бірге оқы! Уақыт шектеуі жоқ.">
<title>БАҚАНЫ БАСЫП, СӨЗДІ ОҚЫ! — 40 сөз</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Times New Roman",serif;background:#72d9ee;color:#113b55;min-height:100vh;overflow-x:hidden}
main{width:min(100%,1400px);margin:auto;padding:12px 14px}
header{position:relative;z-index:2;text-align:center;background:#fff8d9e8;border:5px solid #ffcd55;border-radius:26px;padding:8px 12px;box-shadow:0 5px 14px #22657d30}
h1{font-size:clamp(26px,3.6vw,54px);margin:0;color:#164776;font-weight:900}header p{font-size:clamp(19px,2vw,29px);margin:4px;font-weight:bold}
.bar{display:flex;align-items:center;justify-content:center;gap:24px;font-size:clamp(20px,2.5vw,30px);font-weight:900;margin:10px}
.bar button{font:900 22px "Times New Roman";padding:8px 18px;border:3px solid #1d6688;background:#fffbe4;border-radius:16px;cursor:pointer}
.pond{position:relative;width:100%;height:min(66vh,670px);min-height:410px;border:7px solid #baf1b6;border-radius:32px;overflow:hidden;background:radial-gradient(ellipse at 20% 10%,#b3f7ff 0,#74dce9 35%,#36a9cb 100%);box-shadow:0 10px 25px #1c698450 inset,0 8px 18px #105f7d30}
.water{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad{position:absolute;width:clamp(100px,15vw,205px);height:clamp(66px,9vw,130px);border-radius:55% 45% 52% 48%;background:radial-gradient(ellipse at 40% 30%,#a5f88b,#51bd51 70%,#278a42);border:5px solid #358b43;box-shadow:0 7px 8px #175a743d;transform:rotate(var(--rot));pointer-events:none}
.pad:after{content:"";position:absolute;right:0;top:20%;border-left:30px solid #56c5d8;border-top:15px solid transparent;border-bottom:15px solid transparent}
.flower{position:absolute;font-size:clamp(40px,6vw,82px);filter:drop-shadow(0 5px 3px #237b9c40);pointer-events:none}
.frogBtn{position:absolute;left:50%;top:50%;width:clamp(175px,24vw,300px);height:clamp(185px,26vw,320px);transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;touch-action:manipulation;z-index:4;padding:0;filter:drop-shadow(0 9px 6px #174e4e65)}
.frogBtn:focus-visible{outline:5px solid #f8bd24;border-radius:25px}
.frog{width:100%;height:78%;display:block;position:absolute;left:0;bottom:0;transition:filter .12s}.word{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#fffef2;border:5px solid #f7c84a;border-radius:22px;box-shadow:0 5px 0 #b18026;min-width:75%;padding:3px 12px;font:900 clamp(49px,6.4vw,96px)/1.15 "Times New Roman",serif;color:#050505;white-space:nowrap;z-index:2}
.frogBtn:hover .frog{transform:scale(1.035)}.frogBtn.hopout{opacity:0;transform:translate(-50%,-50%) scale(.3);pointer-events:none}.frogBtn{transition:opacity .18s,transform .18s}.frogBtn.hopin{animation:hop .27s ease-out}@keyframes hop{from{opacity:0;transform:translate(-50%,-30%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.frogBtn:active .frog{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:#10394aa8;display:grid;place-items:center;z-index:10;padding:20px}.overlay.hidden{display:none}
.panel{text-align:center;background:#fffce5;border:8px solid #f6c84c;border-radius:30px;max-width:680px;width:100%;padding:28px 22px;box-shadow:0 18px 60px #0004}
.panel h2{font-size:clamp(35px,5vw,64px);margin:0 0 10px;color:#12577c}.panel p{font-size:clamp(23px,3vw,36px);font-weight:bold}
.primary{background:#ed3b45;color:white;border:0;border-radius:20px;font:900 clamp(30px,4vw,46px) "Times New Roman";padding:13px 45px;cursor:pointer;box-shadow:0 6px 0 #a32231}
@media(max-width:650px){main{padding:7px}.pond{min-height:460px;height:70vh}.frogBtn{width:195px;height:205px}.word{font-size:57px}.bar{gap:8px}.bar button{font-size:17px;padding:7px}}
</style></head><body><main>
<header><h1>🐸 БАҚАНЫ БАСЫП, СӨЗДІ ОҚЫ!</h1><p>Сөзді оқы да, бақаны бас! Бақа басқа жерге секіреді.</p></header>
<div class="bar"><span id="count">Оқылғаны: 0 / 40</span><button id="restart">ҚАЙТА БАСТАУ</button></div>
<div class="pond" id="pond">
<svg class="water" viewBox="0 0 1200 650" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#d5ffff" stroke-width="4" opacity=".5"><ellipse cx="140" cy="110" rx="95" ry="21"/><ellipse cx="960" cy="190" rx="130" ry="28"/><ellipse cx="540" cy="390" rx="150" ry="28"/><ellipse cx="250" cy="560" rx="110" ry="23"/><ellipse cx="1040" cy="535" rx="110" ry="25"/></g><g fill="#e3ffff" opacity=".55"><circle cx="190" cy="260" r="7"/><circle cx="850" cy="350" r="6"/><circle cx="420" cy="160" r="5"/><circle cx="1040" cy="80" r="8"/></g></svg>
<div class="pad" style="left:5%;top:13%;--rot:-20deg"></div><div class="pad" style="left:68%;top:7%;--rot:14deg"></div><div class="pad" style="left:11%;top:70%;--rot:11deg"></div><div class="pad" style="left:75%;top:70%;--rot:-15deg"></div><div class="pad" style="left:43%;top:50%;--rot:9deg"></div>
<div class="flower" style="left:6%;top:3%">🪷</div><div class="flower" style="left:85%;top:10%">🪷</div><div class="flower" style="left:5%;top:80%">🌸</div><div class="flower" style="left:80%;top:79%">🪷</div>
<button class="frogBtn" id="frog" aria-label="Сөзді оқып, бақаны бас">
<span class="word" id="word">ана</span>
<svg class="frog" viewBox="0 0 260 270" aria-hidden="true">
<ellipse cx="130" cy="232" rx="91" ry="18" fill="#166b49" opacity=".28"/>
<path d="M55 200 Q18 205 19 232 L72 234 L94 201 M205 200 Q240 205 241 232 L188 234 L165 201" fill="#5abf43" stroke="#24773a" stroke-width="5"/>
<ellipse cx="130" cy="179" rx="79" ry="65" fill="#62cc47" stroke="#27813c" stroke-width="5"/>
<circle cx="81" cy="101" r="36" fill="#65d94f" stroke="#27813c" stroke-width="5"/><circle cx="179" cy="101" r="36" fill="#65d94f" stroke="#27813c" stroke-width="5"/>
<ellipse cx="130" cy="145" rx="90" ry="68" fill="#6cda4f" stroke="#27813c" stroke-width="5"/>
<ellipse cx="82" cy="99" rx="23" ry="26" fill="#fff"/><ellipse cx="178" cy="99" rx="23" ry="26" fill="#fff"/>
<circle cx="90" cy="102" r="12" fill="#122b2b"/><circle cx="170" cy="102" r="12" fill="#122b2b"/><circle cx="94" cy="97" r="4" fill="#fff"/><circle cx="174" cy="97" r="4" fill="#fff"/>
<ellipse cx="91" cy="156" rx="14" ry="9" fill="#f6a5a7" opacity=".8"/><ellipse cx="169" cy="156" rx="14" ry="9" fill="#f6a5a7" opacity=".8"/>
<circle cx="112" cy="138" r="4" fill="#26803a"/><circle cx="148" cy="138" r="4" fill="#26803a"/>
<path d="M99 159 Q130 190 161 159" fill="none" stroke="#206e3c" stroke-width="6" stroke-linecap="round"/>
<path d="M64 210 Q48 226 45 236 M196 210 Q212 226 215 236" fill="none" stroke="#24773a" stroke-width="7" stroke-linecap="round"/>
</svg></button>
</div></main>
<div class="overlay" id="overlay"><div class="panel"><h2 id="message">🐸 СӨЗДЕРДІ ОҚЫ!</h2><p id="sub">40 сөзді оқы. Уақыт шектеуі жоқ!</p><button class="primary" id="start">БАСТА!</button></div></div>
<script>
const words=["ана", "алма", "ара", "арба", "ата", "арна", "ала", "арқа", "аса", "орда", "алу", "ескі", "ару", "ерке", "ант", "бала", "асу", "дала", "ату", "қала", "мал", "жаңа", "нан", "кеме", "тас", "көже", "құс", "шана", "бал", "бота", "бас", "маса", "сан", "дана", "қол", "сана", "көз", "бақа", "гүл", "өмір"];
const spots=[[26,40],[73,37],[49,67],[19,72],[81,69],[48,34],[72,78],[24,27],[81,28],[51,77],[31,60],[68,53]];
let index=0,spot=-1,busy=false;const frogLooks=["hue-rotate(0deg)","hue-rotate(32deg) saturate(1.1)","hue-rotate(-27deg) saturate(1.15)","hue-rotate(70deg) saturate(1.1)"];
const frog=document.getElementById("frog"),word=document.getElementById("word"),count=document.getElementById("count"),overlay=document.getElementById("overlay"),start=document.getElementById("start");
function place(){let next=(spot+1+Math.floor(Math.random()*(spots.length-1)))%spots.length;spot=next;frog.style.left=spots[spot][0]+"%";frog.style.top=spots[spot][1]+"%";word.textContent=words[index];frog.querySelector(".frog").style.filter=frogLooks[index%frogLooks.length];frog.setAttribute("aria-label",words[index]+" сөзін оқып, бақаны бас")}
function reset(){busy=false;frog.classList.remove("hopout","hopin");index=0;spot=-1;count.textContent="Оқылғаны: 0 / 40";place()}
function intro(){document.getElementById("message").textContent="🐸 СӨЗДЕРДІ ОҚЫ!";document.getElementById("sub").textContent="40 сөзді оқы. Уақыт шектеуі жоқ!";start.textContent="БАСТА!";start.onclick=()=>overlay.classList.add("hidden");overlay.classList.remove("hidden")}
frog.onclick=()=>{if(busy)return;busy=true;frog.classList.remove("hopin");frog.classList.add("hopout");setTimeout(()=>{index++;count.textContent="Оқылғаны: "+index+" / 40";if(index===words.length){document.getElementById("message").textContent="🌟 ЖАРАЙСЫҢ!";document.getElementById("sub").textContent="БАРЛЫҚ 40 СӨЗДІ ОҚЫДЫҢ!";start.textContent="ҚАЙТА ОЙНАУ";start.onclick=()=>{reset();overlay.classList.add("hidden")};overlay.classList.remove("hidden");frog.classList.remove("hopout")}else{place();frog.classList.remove("hopout");void frog.offsetWidth;frog.classList.add("hopin");busy=false}},230)};
document.getElementById("restart").onclick=()=>{reset();intro()};reset();intro();
</script></body></html>
